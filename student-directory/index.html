<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>学生资料搜寻系统</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #f3f4f6;
            -webkit-font-smoothing: antialiased;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .search-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body>
    <!-- Login Screen Modal Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/75 backdrop-blur-sm overflow-y-auto">
        <div class="bg-white/95 w-full max-w-xs sm:max-w-sm rounded-2xl p-5 sm:p-6 shadow-xl border border-white/50 text-center my-auto">
            <!-- School Crest Logo -->
            <div class="flex justify-center mb-2.5">
                <img src="logo.png" alt="亚罗士打新民独立中学" class="h-14 sm:h-16 object-contain drop-shadow-sm" />
            </div>

            <!-- Title -->
            <h2 class="text-base sm:text-lg font-bold text-slate-800 tracking-tight">亚罗士打新民独立中学</h2>
            <p class="text-[11px] text-blue-600 font-bold tracking-wider uppercase mt-0.5 mb-3">学生资料查询系统</p>
            
            <!-- Authorization Notice Card -->
            <div class="bg-blue-50/70 border border-blue-100/80 rounded-lg p-2.5 mb-4 text-[11px] text-slate-600 leading-relaxed text-left">
                <p class="font-semibold text-slate-700">🔒 系统访问提示：</p>
                <p class="mt-0.5">本系统只限亚罗士打新民独立中学教职员使用。未经授权人员请勿尝试登入。</p>
            </div>

            <!-- Login Form -->
            <form id="login-form" onsubmit="return false;" class="space-y-3">
                <div>
                    <input 
                        type="password" 
                        id="login-password" 
                        class="w-full px-3 py-2.5 rounded-lg border border-slate-200 bg-slate-50 text-slate-800 text-center text-base tracking-widest focus:bg-white focus:outline-none focus:ring-2 focus:ring-blue-500 transition-all placeholder:text-xs placeholder:tracking-normal placeholder:text-slate-400"
                        placeholder="请输入访问密码" 
                        required 
                    />
                </div>

                <div id="login-error" class="hidden text-xs text-rose-600 font-semibold bg-rose-50 border border-rose-100 rounded-lg py-1.5">
                    密码错误，请重新输入！
                </div>

                <button 
                    type="submit" 
                    id="login-btn" 
                    class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-xs shadow-md shadow-blue-500/20 transition-all flex items-center justify-center gap-1.5"
                >
                    <span>安全登入系统</span>
                </button>
            </form>

            <!-- Footer info -->
            <div class="mt-4 pt-3 border-t border-slate-100 text-[10px] text-slate-400 font-medium space-y-0.5">
                <p>2026年8月更新</p>
                <p>资讯处 2026 Copyright © 版权所有</p>
            </div>
        </div>
    </div>

    <!-- Image Zoom Lightbox Modal Overlay -->
    <div id="image-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/85 backdrop-blur-md transition-all duration-300">
        <div class="relative bg-white/95 rounded-2xl p-4 max-w-sm w-full shadow-2xl border border-white/40 text-center animate-in fade-in zoom-in-95">
            <button 
                id="close-image-modal" 
                class="absolute -top-3 -right-3 w-8 h-8 bg-slate-800 text-white rounded-full flex items-center justify-center shadow-lg hover:bg-slate-700 transition-colors"
                title="关闭"
            >
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
            <div class="overflow-hidden rounded-xl bg-slate-100 border border-slate-100 mb-3 shadow-inner">
                <img id="modal-img" src="" alt="学生照片大图" class="w-full h-80 object-cover rounded-xl" />
            </div>
            <div class="space-y-1">
                <h3 id="modal-name-zh" class="text-lg font-bold text-slate-900"></h3>
                <p id="modal-name-en" class="text-xs text-slate-500 font-semibold"></p>
                <div class="flex justify-center gap-2 pt-1">
                    <span id="modal-class-badge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-semibold bg-purple-50 text-purple-700"></span>
                    <span id="modal-id-badge" class="inline-flex items-center px-2 py-0.5 rounded text-xs font-bold border"></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Class Statistics Overview Modal Overlay -->
    <div id="stats-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md transition-all">
        <div class="relative bg-white rounded-3xl p-6 max-w-2xl w-full max-h-[85vh] overflow-y-auto shadow-2xl border border-white/40">
            <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center">
                        <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-bold text-slate-800">全校班级人数与宿舍生统计分析</h3>
                        <p class="text-xs text-slate-400">亚罗士打新民独立中学 资讯处数据分析</p>
                    </div>
                </div>
                <button id="close-stats-modal" class="p-1.5 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <div id="stats-content" class="space-y-4">
                <!-- Statistics Cards populated dynamically -->
            </div>
        </div>
    </div>

    <style>
        @media print {
            body { background: white !important; }
            #login-overlay, .sticky, #logout-btn, #search-box, select, #fav-filter-btn, #show-stats-btn, #print-btn, #image-modal, #stats-modal, .group-hover\/avatar\:opacity-100 {
                display: none !important;
            }
            .grid { display: grid !important; grid-template-cols: repeat(2, minmax(0, 1fr)) !important; gap: 12px !important; }
            .shadow-sm, .shadow-md, .shadow-2xl { box-shadow: none !important; }
            .border { border: 1px solid #e2e8f0 !important; }
            .max-w-4xl { max-w-full !important; padding: 0 !important; }
            .print-header { display: block !important; margin-bottom: 20px; text-align: center; }
        }
        .print-header { display: none; }
    </style>

    <div id="app" class="min-h-screen pb-10 hidden">
        <!-- Print Header Only visible when printing -->
        <div class="print-header">
            <h1 class="text-xl font-bold text-gray-900">亚罗士打新民独立中学 学生名单</h1>
            <p class="text-xs text-gray-500 mt-1" id="print-subtitle"></p>
        </div>

        <!-- Header & Filters (Static Layout) -->
        <div class="glass-panel sticky top-0 z-10 px-4 py-3 shadow-sm mb-6">
            <div class="max-w-4xl mx-auto">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-3">
                        <img src="logo.png" alt="校徽" class="h-10 w-auto object-contain drop-shadow-sm" />
                        <div>
                            <h1 class="text-base sm:text-lg font-bold text-gray-800 leading-tight">亚罗士打新民独立中学</h1>
                            <div class="flex items-center gap-2 mt-0.5">
                                <p class="text-[11px] text-blue-600 font-bold">学生资料查询系统</p>
                                <span class="text-gray-300 text-[10px]">|</span>
                                <p id="live-datetime" class="text-[11px] text-slate-500 font-medium"></p>
                            </div>
                        </div>
                    </div>
                    <button 
                        id="logout-btn" 
                        class="text-xs px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-slate-600 hover:bg-slate-50 hover:text-slate-900 transition-all font-medium flex items-center gap-1.5 shadow-sm"
                    >
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">退出登录</span>
                    </button>
                </div>
                
                <div class="flex flex-col md:flex-row gap-3">
                    <!-- Search Input -->
                    <div class="relative flex-grow">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                        </div>
                        <input
                            id="search-box"
                            type="text"
                            class="search-input w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 bg-white shadow-sm text-gray-700 placeholder-gray-400 transition-all text-base"
                            placeholder="输入姓名 (e.g. 陈, tan) 或 学号搜索..."
                        />
                        <button 
                            id="clear-search"
                            class="hidden absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600"
                        >
                            <i data-lucide="x-circle" class="w-5 h-5"></i>
                        </button>
                    </div>

                    <div class="flex gap-2">
                        <!-- Class Filter -->
                        <div class="relative flex-1 md:w-[150px]">
                            <select
                                id="class-filter"
                                class="search-input w-full appearance-none pl-3 pr-8 py-3 rounded-xl border border-gray-200 bg-white shadow-sm text-gray-700 text-sm font-medium cursor-pointer"
                            >
                                <option value="全部">全部班级</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500"></i>
                            </div>
                        </div>

                        <!-- Hostel Filter -->
                        <div class="relative flex-1 md:w-[120px]">
                            <select
                                id="hostel-filter"
                                class="search-input w-full appearance-none pl-3 pr-8 py-3 rounded-xl border border-gray-200 bg-white shadow-sm text-gray-700 text-sm font-medium cursor-pointer"
                            >
                                <option value="全部">全部住宿</option>
                                <option value="宿舍生">宿舍生</option>
                                <option value="走读生">走读生</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 pr-2 flex items-center pointer-events-none">
                                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-500"></i>
                            </div>
                        </div>

                        <!-- Action Buttons: Favorites, Stats, Print -->
                        <div class="flex gap-1.5">
                            <button
                                id="fav-filter-btn"
                                class="p-3 rounded-xl border border-gray-200 bg-white hover:bg-amber-50 text-gray-400 hover:text-amber-500 transition-all shadow-sm flex items-center justify-center"
                                title="仅看已收藏学生"
                            >
                                <i data-lucide="star" class="w-5 h-5"></i>
                            </button>

                            <button
                                id="show-stats-btn"
                                class="p-3 rounded-xl border border-gray-200 bg-white hover:bg-blue-50 text-gray-600 hover:text-blue-600 transition-all shadow-sm flex items-center justify-center"
                                title="全校班级统计图表"
                            >
                                <i data-lucide="bar-chart-2" class="w-5 h-5"></i>
                            </button>

                            <button
                                id="print-btn"
                                class="p-3 rounded-xl border border-blue-200 bg-blue-600 hover:bg-blue-700 text-white transition-all shadow-sm flex items-center justify-center"
                                title="打印 / 导出当前名单"
                            >
                                <i data-lucide="printer" class="w-5 h-5"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Results Counter - 显示男女比例 (带颜色) -->
        <div class="max-w-4xl mx-auto px-4 mb-4 flex justify-between items-center text-sm font-semibold text-gray-500">
            <p class="flex items-center gap-2">
                <span id="results-count">找到 0 名学生</span>
                <span class="text-xs font-normal bg-white border border-gray-200 px-3 py-1 rounded-full flex gap-2 shadow-sm">
                    <span class="text-blue-600 font-semibold" id="male-count">男: 0</span>
                    <span class="text-gray-300">|</span>
                    <span class="text-pink-600 font-semibold" id="female-count">女: 0</span>
                </span>
            </p>
            <div class="flex gap-4">
                <span class="flex items-center gap-1.5 text-xs text-blue-600 font-medium"><span class="w-2 h-2 rounded-full bg-blue-500"></span>男生</span>
                <span class="flex items-center gap-1.5 text-xs text-pink-600 font-medium"><span class="w-2 h-2 rounded-full bg-pink-500"></span>女生</span>
            </div>
        </div>

        <!-- Student List Container -->
        <div id="student-list" class="max-w-4xl mx-auto px-4">
            <!-- Dynamic Cards Go Here -->
        </div>
    </div>

        window.copyToClipboard = function(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`已成功复制 ${label}`);
            }).catch(() => {
                showToast(`复制失败，请重试`);
            });
        };

        function showToast(msg) {
            let toast = document.getElementById("toast-msg");
            if (!toast) {
                toast = document.createElement("div");
                toast.id = "toast-msg";
                toast.className = "fixed bottom-5 right-5 z-50 bg-slate-900/90 text-white px-4 py-2.5 rounded-xl shadow-xl text-xs font-semibold backdrop-blur-sm transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-none";
                document.body.appendChild(toast);
            }
            toast.textContent = msg;
            toast.classList.remove("opacity-0", "translate-y-2");
            toast.classList.add("opacity-100", "translate-y-0");
            setTimeout(() => {
                toast.classList.remove("opacity-100", "translate-y-0");
                toast.classList.add("opacity-0", "translate-y-2");
            }, 2000);
        }

        // 初始化班级下拉框
        classFilter.innerHTML = CLASSES.map(cls => 
            `<option value="${cls}">${cls === '全部' ? '全部班级' : cls}</option>`
        ).join('');

        // 过滤与渲染主函数
        function updateResults() {
            // 联合过滤
            const filtered = MOCK_STUDENTS.filter(student => {
                // 仅看收藏过滤
                if (onlyFavoritesFilter && !favoriteIds.has(student.id)) {
                    return false;
                }

                // 班级过滤
                if (selectedClass !== "全部" && student.class_zh !== selectedClass) {
                    return false;
                }
                
                // 宿舍生过滤
                if (hostelFilter === "宿舍生" && !student.is_hostel) return false;
                if (hostelFilter === "走读生" && student.is_hostel) return false;
                
                // 关键词过滤 (支持中文名、英文名、学号，忽略大小写)
                const query = searchQuery.toLowerCase().trim();
                if (!query) return true;

                return (
                    student.name_zh.includes(query) ||
                    student.name_en.toLowerCase().includes(query) ||
                    student.id.includes(query)
                );
            });

            // 计算男女数量
            const maleCount = filtered.filter(s => s.gender === '男').length;
            const femaleCount = filtered.filter(s => s.gender === '女').length;

            // 更新计数器 DOM
            resultsCountEl.textContent = `找到 ${filtered.length} 名学生`;
            maleCountEl.textContent = `男: ${maleCount}`;
            femaleCountEl.textContent = `女: ${femaleCount}`;

            // 显示/隐藏清除按钮
            if (searchQuery) {
                clearBtn.classList.remove("hidden");
            } else {
                clearBtn.classList.add("hidden");
            }

            // 渲染学生列表
            if (filtered.length > 0) {
                studentListEl.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${filtered.map(student => {
                            const isBoy = student.gender === '男';
                            const genderBadgeBg = isBoy ? 'bg-blue-500' : 'bg-pink-500';
                            
                            // 修正：男生学号蓝色，女生学号红色
                            const idBadgeClass = isBoy 
                                ? 'bg-blue-50 text-blue-600 border-blue-100' 
                                : 'bg-rose-50 text-red-600 border-rose-100'; // 红色字体用 text-red-600
                            
                            const hostelBadgeHtml = student.is_hostel 
                                ? `<span class="inline-flex items-center px-1.5 py-0.5 rounded-md text-[9px] font-bold bg-amber-50 text-amber-700 border border-amber-200">宿舍</span>`
                                : `<span class="inline-flex items-center px-1.5 py-0.5 rounded-md text-[9px] font-bold bg-slate-100 text-slate-600 border border-slate-200">走读</span>`;

                            const isFav = favoriteIds.has(student.id);
                            const favIconColor = isFav ? 'text-amber-400 fill-amber-400' : 'text-gray-300 hover:text-amber-400';

                            return `
                                <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between hover:shadow-md transition-shadow cursor-pointer group relative overflow-hidden">
                                    <!-- Favorite Star Button -->
                                    <button 
                                        onclick="toggleFavorite('${student.id}')" 
                                        class="absolute top-3 right-3 p-1 rounded-full hover:bg-slate-50 transition-colors z-10"
                                        title="${isFav ? '取消收藏' : '收藏此学生'}"
                                    >
                                        <i data-lucide="star" class="w-4 h-4 ${favIconColor}"></i>
                                    </button>

                                    <!-- Card Top: Avatar and Name -->
                                    <div class="flex gap-4 items-start mb-3 pr-6">
                                        <div class="relative flex-shrink-0 cursor-pointer group/avatar" onclick="openImageModal('${student.photo}', '${student.name_zh.replace(/'/g, "\\'")}', '${student.name_en.replace(/'/g, "\\'")}', '${student.class_zh} (${student.class_code})', '${student.id}', '${student.gender}')" title="点击放大照片">
                                            <img 
                                                src="${student.photo}" 
                                                alt="${student.name_zh}"
                                                class="w-16 h-16 rounded-xl object-cover border border-gray-100 shadow-sm group-hover/avatar:scale-105 transition-transform"
                                            />
                                            <div class="absolute inset-0 bg-slate-900/30 rounded-xl opacity-0 group-hover/avatar:opacity-100 transition-opacity flex items-center justify-center text-white">
                                                <i data-lucide="zoom-in" class="w-5 h-5 drop-shadow"></i>
                                            </div>
                                            <!-- Gender Indicator Badge -->
                                            <div class="absolute -bottom-1 -right-1 w-5 h-5 rounded-full flex items-center justify-center text-white border-2 border-white text-[9px] font-bold ${genderBadgeBg}">
                                                ${student.gender}
                                            </div>
                                        </div>
                                        
                                        <div class="min-w-0 flex-1">
                                            <div class="flex items-center gap-1.5 flex-wrap">
                                                <h3 class="text-base font-bold text-gray-900 truncate">${student.name_zh}</h3>
                                                ${hostelBadgeHtml}
                                            </div>
                                            <p class="text-xs text-slate-600 font-semibold truncate mb-1.5 mt-0.5">${student.name_en}</p>
                                            <div class="mt-1 flex items-center gap-1">
                                                <span class="inline-flex items-center px-1.5 py-0.5 rounded-md text-[10px] font-bold border ${idBadgeClass}">
                                                    学号: ${student.id}
                                                </span>
                                                <button 
                                                    onclick="copyToClipboard('${student.id}', '学号 ${student.id}')" 
                                                    class="p-1 text-slate-400 hover:text-blue-600 transition-colors"
                                                    title="一键复制学号"
                                                >
                                                    <i data-lucide="copy" class="w-3 h-3"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Card Bottom: Class and Teacher -->
                                    <div class="border-t border-gray-50 pt-3 mt-1 flex justify-between items-center text-xs">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-semibold bg-purple-50 text-purple-700">
                                            ${student.class_zh} (${student.class_en})
                                        </span>
                                        
                                        <span class="text-[11px] text-gray-500 font-medium">
                                            班导师: <span class="text-gray-700 font-semibold">${student.teacher}</span>
                                        </span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } else {
                studentListEl.innerHTML = `
                    <div class="text-center py-20">
                        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gray-100 mb-4">
                            <i data-lucide="search-x" class="w-8 h-8 text-gray-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-900 mb-1">未找到匹配的学生</h3>
                        <p class="text-gray-500">请尝试更换搜索词或筛选条件</p>
                    </div>
                `;
            }

            // 重新解析 Lucide 图标
            lucide.createIcons();
        }

        // 绑定事件监听器
        searchBox.addEventListener("input", (e) => {
            searchQuery = e.target.value;
            updateResults();
        });

        clearBtn.addEventListener("click", () => {
            searchQuery = "";
            searchBox.value = "";
            updateResults();
            searchBox.focus();
        });

        classFilter.addEventListener("change", (e) => {
            selectedClass = e.target.value;
            updateResults();
        });

        hostelFilterSelect.addEventListener("change", (e) => {
            hostelFilter = e.target.value;
            updateResults();
        });

        favFilterBtn.addEventListener("click", () => {
            onlyFavoritesFilter = !onlyFavoritesFilter;
            if (onlyFavoritesFilter) {
                favFilterBtn.classList.remove("text-gray-400", "bg-white");
                favFilterBtn.classList.add("text-amber-500", "bg-amber-50", "border-amber-200");
            } else {
                favFilterBtn.classList.remove("text-amber-500", "bg-amber-50", "border-amber-200");
                favFilterBtn.classList.add("text-gray-400", "bg-white");
            }
            updateResults();
        });

        // 打印与导出当前名单
        printBtn.addEventListener("click", () => {
            const printSubtitle = document.getElementById("print-subtitle");
            const classText = selectedClass === "全部" ? "全校" : selectedClass;
            const hostelText = hostelFilter === "全部" ? "" : ` (${hostelFilter})`;
            printSubtitle.textContent = `打印筛选范围：${classText}${hostelText} | 生成时间：${new Date().toLocaleDateString('zh-CN')}`;
            window.print();
        });

        // 班级统计分析图表 Modal 逻辑
        const statsModal = document.getElementById("stats-modal");
        const closeStatsModalBtn = document.getElementById("close-stats-modal");
        const statsContent = document.getElementById("stats-content");

        showStatsBtn.addEventListener("click", () => {
            renderStatsOverview();
            statsModal.classList.remove("hidden");
            statsModal.classList.add("flex");
            lucide.createIcons();
        });

        function closeStatsModal() {
            statsModal.classList.add("hidden");
            statsModal.classList.remove("flex");
        }

        if (closeStatsModalBtn) {
            closeStatsModalBtn.addEventListener("click", closeStatsModal);
        }

        if (statsModal) {
            statsModal.addEventListener("click", (e) => {
                if (e.target === statsModal) {
                    closeStatsModal();
                }
            });
        }

        function renderStatsOverview() {
            const classStatsMap = {};
            let totalStudentsCount = MOCK_STUDENTS.length;
            let totalHostelCount = 0;
            let totalDayCount = 0;
            let totalMaleCount = 0;
            let totalFemaleCount = 0;

            CLASSES.filter(c => c !== "全部").forEach(c => {
                classStatsMap[c] = { total: 0, male: 0, female: 0, hostel: 0, day: 0, teacher: "" };
            });

            MOCK_STUDENTS.forEach(s => {
                if (!classStatsMap[s.class_zh]) return;
                const stat = classStatsMap[s.class_zh];
                stat.total++;
                stat.teacher = s.teacher;
                if (s.gender === '男') { stat.male++; totalMaleCount++; }
                else { stat.female++; totalFemaleCount++; }
                if (s.is_hostel) { stat.hostel++; totalHostelCount++; }
                else { stat.day++; totalDayCount++; }
            });

            const overallHostelPercent = Math.round((totalHostelCount / totalStudentsCount) * 100);

            statsContent.innerHTML = `
                <!-- Total Summary Bar -->
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                    <div class="bg-slate-50 p-3 rounded-2xl border border-slate-100 text-center">
                        <p class="text-[11px] text-slate-400 font-medium">全校总人数</p>
                        <p class="text-xl font-extrabold text-slate-800 mt-0.5">${totalStudentsCount} <span class="text-xs font-normal">名</span></p>
                    </div>
                    <div class="bg-blue-50/70 p-3 rounded-2xl border border-blue-100 text-center">
                        <p class="text-[11px] text-blue-500 font-medium">男生总计</p>
                        <p class="text-xl font-extrabold text-blue-600 mt-0.5">${totalMaleCount} <span class="text-xs font-normal">名</span></p>
                    </div>
                    <div class="bg-pink-50/70 p-3 rounded-2xl border border-pink-100 text-center">
                        <p class="text-[11px] text-pink-500 font-medium">女生总计</p>
                        <p class="text-xl font-extrabold text-pink-600 mt-0.5">${totalFemaleCount} <span class="text-xs font-normal">名</span></p>
                    </div>
                    <div class="bg-amber-50/70 p-3 rounded-2xl border border-amber-100 text-center">
                        <p class="text-[11px] text-amber-600 font-medium">宿舍生总数</p>
                        <p class="text-xl font-extrabold text-amber-700 mt-0.5">${totalHostelCount} <span class="text-xs font-normal">(${overallHostelPercent}%)</span></p>
                    </div>
                </div>

                <!-- Class Breakdown Grid -->
                <div class="pt-2">
                    <h4 class="text-xs font-bold text-slate-500 mb-2 uppercase tracking-wider">各班级人数明细表 (12个班级)</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        ${Object.keys(classStatsMap).map(clsName => {
                            const st = classStatsMap[clsName];
                            const hostelRatio = st.total > 0 ? Math.round((st.hostel / st.total) * 100) : 0;
                            return `
                                <div class="p-3 rounded-xl border border-slate-100 bg-white shadow-sm flex flex-col justify-between">
                                    <div class="flex justify-between items-center mb-1.5">
                                        <div class="flex items-center gap-1.5">
                                            <span class="font-bold text-slate-800 text-sm">${clsName}</span>
                                            <span class="text-[10px] text-slate-400 font-normal">(班导师: ${st.teacher})</span>
                                        </div>
                                        <span class="text-xs font-extrabold text-blue-600">${st.total} 名</span>
                                    </div>
                                    <div class="space-y-1">
                                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden flex">
                                            <div class="bg-blue-500 h-full" style="width: ${st.total > 0 ? (st.male/st.total)*100 : 0}%" title="男生 ${st.male}人"></div>
                                            <div class="bg-pink-500 h-full" style="width: ${st.total > 0 ? (st.female/st.total)*100 : 0}%" title="女生 ${st.female}人"></div>
                                        </div>
                                        <div class="flex justify-between items-center text-[10px] text-slate-500 font-medium">
                                            <span>男: ${st.male} | 女: ${st.female}</span>
                                            <span class="text-amber-600 font-semibold">宿舍生: ${st.hostel}名 (${hostelRatio}%)</span>
                                        </div>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // 登录验证逻辑
        const AUTH_KEY = "sinmin_auth_token";
        const PASSWORD_CORRECT = "sinmin888";

        const loginOverlay = document.getElementById("login-overlay");
        const loginForm = document.getElementById("login-form");
        const loginPasswordInput = document.getElementById("login-password");
        const loginErrorEl = document.getElementById("login-error");
        const appContainer = document.getElementById("app");
        const logoutBtn = document.getElementById("logout-btn");

        function checkAuthStatus() {
            const isAuth = sessionStorage.getItem(AUTH_KEY) === "true";
            if (isAuth) {
                loginOverlay.classList.add("hidden");
                appContainer.classList.remove("hidden");
                updateResults();
            } else {
                loginOverlay.classList.remove("hidden");
                appContainer.classList.add("hidden");
            }
        }

        loginForm.addEventListener("submit", (e) => {
            e.preventDefault();
            const val = loginPasswordInput.value.trim();
            if (val === PASSWORD_CORRECT) {
                sessionStorage.setItem(AUTH_KEY, "true");
                loginErrorEl.classList.add("hidden");
                loginPasswordInput.value = "";
                checkAuthStatus();
            } else {
                loginErrorEl.classList.remove("hidden");
                loginPasswordInput.focus();
            }
        });

        logoutBtn.addEventListener("click", () => {
            sessionStorage.removeItem(AUTH_KEY);
            checkAuthStatus();
        });

        // 实时日期与时间更新 (格式: YYYY年M月D日 星期X hh:mm am/pm，不含秒数)
        const liveDateTimeEl = document.getElementById("live-datetime");
        
        function updateLiveDateTime() {
            if (!liveDateTimeEl) return;
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
            const dayName = days[now.getDay()];
            
            let hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12; // 12小时制转换
            
            liveDateTimeEl.textContent = `${year}年${month}月${date}日 ${dayName} ${hours}:${minutes} ${ampm}`;
        }

        setInterval(updateLiveDateTime, 10000);
        updateLiveDateTime();

        // 照片放大 Modal 逻辑
        const imageModal = document.getElementById("image-modal");
        const modalImg = document.getElementById("modal-img");
        const modalNameZh = document.getElementById("modal-name-zh");
        const modalNameEn = document.getElementById("modal-name-en");
        const modalClassBadge = document.getElementById("modal-class-badge");
        const modalIdBadge = document.getElementById("modal-id-badge");
        const closeImageModalBtn = document.getElementById("close-image-modal");

        window.openImageModal = function(photoUrl, nameZh, nameEn, classStr, studentId, gender) {
            modalImg.src = photoUrl;
            modalNameZh.textContent = nameZh;
            modalNameEn.textContent = nameEn;
            modalClassBadge.textContent = classStr;
            modalIdBadge.textContent = `学号: ${studentId}`;
            
            const isBoy = gender === '男';
            modalIdBadge.className = `inline-flex items-center px-2 py-0.5 rounded text-xs font-bold border ${
                isBoy ? 'bg-blue-50 text-blue-600 border-blue-100' : 'bg-rose-50 text-red-600 border-rose-100'
            }`;

            imageModal.classList.remove("hidden");
            imageModal.classList.add("flex");
            lucide.createIcons();
        };

        function closeImageModal() {
            imageModal.classList.add("hidden");
            imageModal.classList.remove("flex");
        }

        if (closeImageModalBtn) {
            closeImageModalBtn.addEventListener("click", closeImageModal);
        }

        if (imageModal) {
            imageModal.addEventListener("click", (e) => {
                if (e.target === imageModal) {
                    closeImageModal();
                }
            });
        }

        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && !imageModal.classList.contains("hidden")) {
                closeImageModal();
            }
        });

        // 首次加载渲染
        document.addEventListener("DOMContentLoaded", () => {
            checkAuthStatus();
        });
    </script>
</body>
</html>
